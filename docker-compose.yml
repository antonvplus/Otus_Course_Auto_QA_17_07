version: '3.8'

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    restart: unless-stopped
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid:ro
      - ./video:/opt/selenoid/video
      - ./logs:/opt/selenoid/logs
    environment:
      - OVERRIDE_ENV=1
      - DOCKER_API_VERSION=1.44
    command: ["-conf", "/etc/selenoid/browsers.json", "-container-network", "selenoid", "-video-output-dir", "/opt/selenoid/video", "-log-output-dir", "/opt/selenoid/logs"]

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    networks:
      - selenoid
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    container_name: mysql_db
    restart: unless-stopped
    networks:
      - selenoid
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop
    restart: unless-stopped
    networks:
      - selenoid
    ports:
      - "8081:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: "en"
      PS_COUNTRY: "US"
      PS_DEV_MODE: "1"
      PS_DOMAIN: "localhost:8081"
      ADMIN_MAIL: "admin@example.com"
      ADMIN_PASSWD: "Admin123!"
      PS_FOLDER_ADMIN: "administration"
      PS_FOLDER_INSTALL: "install"
    volumes:
      - ps_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  prestashop_postinstall:
    image: alpine:3.19
    container_name: prestashop_postinstall
    restart: "no"
    networks:
      - selenoid
    depends_on:
      - prestashop
    volumes:
      - ps_data:/var/www/html
    command: >
      sh -lc '
        apk add --no-cache curl >/dev/null 2>&1 || true;
        echo "Waiting for PrestaShop HTTP to respond...";
        until curl -fsS http://prestashop/ >/dev/null; do sleep 5; done;
        echo "Waiting for config to exist...";
        until [ -f /var/www/html/config/settings.inc.php ] || [ -f /var/www/html/app/config/parameters.php ]; do sleep 2; done;
        echo "Extra grace period...";
        sleep 15;
        echo "Removing install folders...";
        rm -rf /var/www/html/install /var/www/html/install-dev || true;
        echo "Clearing cache...";
        rm -rf /var/www/html/var/cache/* || true;
        echo "Done."
      '
  tests:
    image: tests
    container_name: pytest_tests
    networks:
      - selenoid
    command: [ "--base-url", "http://prestashop/", "--executor", "selenoid" ]
    depends_on:
      selenoid:
        condition: service_started
      prestashop_postinstall:
        condition: service_completed_successfully

volumes:
  db_data:
    driver: local
  ps_data:
    driver: local

networks:
  selenoid:
    external:
      name: selenoid

